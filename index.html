<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Meter ♡</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 배경 장식 요소들 -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <figure class="photo-decoration">
      <img src="IMG_7687.JPG" alt="언니와 함께 찍은 사진">
    </figure>

    <!-- 1~3단계: 측정 화면 -->
    <div class="card" id="mainCard">
      <div class="header-tag" id="headerTag">LOVE METER</div>
      
      <div class="character-area">
        <div class="heart-character" id="heartCharacter">💙</div>
      </div>

      <div class="content-area">
        <h1 class="title" id="mainTitle">나연이는 소진언니를 얼마나 사랑할까?</h1>
        <p class="subtitle" id="mainSubtitle">먼저 얼마나 사랑할지 예상해 봐!</p>
        
        <div class="meter-box" id="meterBox" hidden aria-live="polite">
          <span class="meter-label">LOVE LEVEL</span>
          <div class="meter-value" id="meterValue">100%</div>
          <p class="guess-result" id="guessResult"></p>
          <div class="meter-track" id="meterTrack" role="progressbar" aria-label="사랑 측정 진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="meter-progress" id="meterProgress"></div>
          </div>
          <p class="meter-status" id="meterStatus">사랑을 측정하고 있어...</p>
        </div>
      </div>

      <form class="guess-form" id="guessForm">
        <label class="guess-label" for="loveGuess">얼마나 사랑한다고 생각해?</label>
        <div class="guess-input-wrap">
          <input class="guess-input" id="loveGuess" name="loveGuess" type="text" placeholder="예: 우주만큼" autocomplete="off" required>
          <span aria-hidden="true">💙</span>
        </div>
        <button class="cute-btn" id="actionBtn" type="submit">예상하고 측정하기 💙</button>
      </form>
    </div>

    <!-- 4단계: 최종 고백 화면 (숨김 처리) -->
    <div class="card final-card" id="finalCard" style="display: none;">
      <div class="final-gallery" aria-label="함께한 추억 사진">
        <figure class="final-photo final-photo--left">
          <img src="IMG_5066.jpg" alt="함께 찍은 추억 사진 1">
        </figure>
        <figure class="final-photo final-photo--right">
          <img src="IMG_4729.jpeg" alt="함께 찍은 추억 사진 2">
        </figure>
      </div>
      <div class="error-badge">ERROR 404 ♡</div>
      <div class="character-area">
        <div class="heart-character bounce">💙🌏✨</div>
      </div>
      <div class="content-area">
        <h2 class="final-title">Love limit not found.</h2>
        <p class="final-message">
          수치로 계산 못하지만 <br>그 아마도 내가 언니를 사랑하는 정도는 우주만큼  아니 그 이상일거야!<br>
          엄청 엄청 사랑해.<br> 나랑 사귀어줘서 고마워 ♡
        </p>
      </div>
      <button class="cute-btn" id="hugBtn"> 나랑 평생 만날래? <br>그럼 이 버튼을 눌러요!</button>
      <button class="reset-btn" id="resetBtn">처음부터 다시 보기 ↺</button>
    </div>
  </div>

  <div class="heart-rain" id="heartRain" aria-hidden="true"></div>
  <div class="heart-burst" id="heartBurst" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
